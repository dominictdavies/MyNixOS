[bar.default]
end = [ "recorder", "notifications", "bluetooth", "network", "volume", "brightness", "battery", "clock" ]
start = [ "clipboard", "taskbar", "media" ]

[battery]
warning_threshold = 20

[lockscreen]
wallpaper = "~/MyNixOS/assets/wallpapers/stanley_parable_desk_lined.png"

[plugin_settings."noctalia/screen_recorder"]
audio_codec = "flac"
audio_source = "both"
color_range = "full"
directory = "/mnt/terra/Unsorted"
replay_duration = 240
replay_enabled = true
replay_filename_pattern = "clip_%Y%m%d_%H%M%S"
video_codec = "vp9"
video_qp = 20
video_source = "portal"

[shell]
avatar_path = "~/MyNixOS/assets/profile.png"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "starship" ]

[wallpaper]
directory = "~/MyNixOS/assets/wallpapers"

[widget.network]
show_label = false

[widget.volume]
show_label = false
