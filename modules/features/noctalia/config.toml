[bar.default]
center = [ "workspaces" ]
contact_shadow = true
end = [ "notifications", "volume", "brightness", "battery", "clock" ]
margin_ends = 0
radius = 0
shadow = false
start = [ "network", "bluetooth", "clipboard", "media" ]

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
enabled = false

[hot_corners]
enabled = true

    [hot_corners.top_right]
    action = "launcher"

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.0
tint_intensity = 0.0
wallpaper = "/home/dominictdavies/MyNixOS/assets/wallpapers/stanley_parable_desk_lined.png"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-2",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 24
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1032.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 128.0
    box_width = 288.0
    cx = 1280.0
    cy = 368.0
    output = "DP-2"
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 312.0
    box_width = 360.0
    cx = 1284.0
    cy = 620.0
    output = "DP-2"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        background_color = "surface"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        bar_width = 0.59999999999999998
        bloom_intensity = 0.5
        fade_when_idle = true
        inner_diameter = 0.69999999999999996
        primary_color = "primary"
        ring_opacity = 0.80000000000000004
        rotation_speed = 0.5
        secondary_color = "secondary"
        sensitivity = 1.5
        visualization_mode = "bars_rings"
        wave_thickness = 1.0

[nightlight]
enabled = true

[shell]
avatar_path = "/home/dominictdavies/MyNixOS/assets/profile.png"
telemetry_enabled = true

    [shell.panel]
    control_center_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    directory = "/home/dominictdavies/Pictures/Screenshots"

    [shell.shadow]
    direction = "center"

[theme]
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "starship" ]

[wallpaper]
directory = "/home/dominictdavies/MyNixOS/assets/wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/dominictdavies/MyNixOS/assets/wallpapers/deltarune.png"

    [wallpaper.last]
    path = "/home/dominictdavies/MyNixOS/assets/wallpapers/deltarune.png"

    [wallpaper.monitors.DP-2]
    path = "/home/dominictdavies/MyNixOS/assets/wallpapers/deltarune.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/dominictdavies/MyNixOS/assets/wallpapers/deltarune.png"
